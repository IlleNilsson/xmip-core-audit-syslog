[package]
name = "xmip-core-audit-syslog"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-audit-syslog"
description = "The local syslog socket: the systemd journal on Linux, the unified log on macOS. ADR-0062's operating system's log on Unix, which the program that runs hands its audit when audit cannot persist. A xmip-core-audit technology."
publish = false

[lib]
path = "src/lib.rs"

# Every dependency is Unix's alone: on any other platform the crate is empty,
# and cargo refuses a dependency a build does not use (unused_dependencies,
# Cargo 1.100).
[target.'cfg(unix)'.dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the operating system's log is audit's seam, and
# the entry's text audit's.
audit = { package = "xmip-core-audit", git = "https://github.com/IlleNilsson/xmip-core-audit", branch = "main" }
# The severity an entry is written at.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints.rust]
# forbid, not deny: a datagram is sent through the standard library alone.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
